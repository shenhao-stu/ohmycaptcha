services:
  - type: web
    name: captcha-solver
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CLIENT_KEY
        sync: false
      - key: CLOUD_BASE_URL
        value: "https://your-openai-compatible-endpoint/v1"
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_MODEL
        value: "gpt-5.4"
      - key: LOCAL_BASE_URL
        value: "https://your-openai-compatible-endpoint/v1"
      - key: LOCAL_API_KEY
        sync: false
      - key: LOCAL_MODEL
        value: "Qwen/Qwen3.5-2B"
      - key: CAPTCHA_RETRIES
        value: "3"
      - key: CAPTCHA_TIMEOUT
        value: "30"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: BROWSER_TIMEOUT
        value: "30"
